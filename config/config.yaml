# Banking Intent Classifier Configuration
# =======================================

project:
  name: "AI Customer Support Ticket Classifier"
  version: "2.0.0"
  author: "Mohammad Hussein"
  description: "Banking intent classification with TF-IDF + Logistic Regression"

data:
  selected_intents:
    - card_arrival
    - card_not_working
    - cash_withdrawal_not_recognised
    - declined_card_payment
    - lost_or_stolen_card
    - transaction_charged_twice
    - transfer_not_received_by_recipient
    - cash_withdrawal_charge
  
  test_size: 0.2
  random_state: 42
  
  business_critical:
    - lost_or_stolen_card
    - declined_card_payment
    - transaction_charged_twice

preprocessing:
  lowercase: true
  remove_punctuation: true
  remove_stopwords: true
  lemmatize: true
  min_word_length: 2
  max_word_length: 20

features:
  max_features: 5000
  ngram_range: [1, 2]
  min_df: 2
  max_df: 0.95
  sublinear_tf: true

model:
  name: "logistic_regression"
  params:
    C: 1.0
    class_weight: "balanced"
    max_iter: 1000
    random_state: 42
    n_jobs: -1

evaluation:
  review_threshold: 0.7
  cv_folds: 5
  
output:
  model_dir: "models/production_v2"
  reports_dir: "reports"
  figures_dir: "reports/figures"
  tables_dir: "reports/tables"
